# CloudOS Package Recipes Repository Configuration
# This file configures the cloudpkg-recipes overlay

[cloudpkg-recipes]
# Repository location (local path)
location = /home/wh1laye/cloudpkg-recipes

# Masters - this overlay extends cloudos repo
masters = cloudos

# Auto-sync - disable for local overlays
auto-sync = no

# Priority - higher than gentoo, lower than cloudos
priority = 5

# Thin manifests - use thin manifests to save space
thin-manifests = true

# Disable signing for local development
sign-manifests = false

# Cache settings
cache-formats =
cache-key-required = no
